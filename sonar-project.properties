sonar.organization=kuzzleio
sonar.projectKey=kuzzleio_kuzzle

# relative paths to source directories. More details and properties are described
# at https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/
sonar.sources=./lib
# Both unit-test trees: ./test is the legacy Mocha suite, ./tests the vitest one
# (ADR-0001 — the mocha specs are frozen, every new spec goes to ./tests).
sonar.tests=./test,./tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
# One lcov per unit runner — both are produced by the `sonarqube` CI job.
sonar.javascript.lcov.reportPaths=coverage/mocha/lcov.info,coverage/vitest/lcov.info

# Coverage exclusions
#
# `**/*.ts` used to be listed here (since #2658, before the TypeScript-migration ADR).
# It made every .js -> .ts conversion silently remove its own file from the
# "Coverage on New Code" gate — vacuous on exactly the lines a conversion touches, and
# it had already swallowed 30 converted files. Removed: c8 applies the source maps
# emitted by `tsc` (`sourceMap: true`), so the lcov produced by the Mocha run over
# `dist/` already points at `lib/**/*.ts`. Verified 2026-09-09: 172 .ts files in the
# report, the 30 converted ones at 85.9% line coverage.
# See ADR-0001 step 06 / type-debt register TD-24 (#2692).
sonar.coverage.exclusions=**/*.vue

# esWrapper.ts is intentionally duplicated per Elasticsearch major version
# (sdk-es7 / sdk-es8 version-specific adapters); deduplicating them is an
# explicit non-goal of the TS migration (ADR-0001: Conversion standards; step 01, Appendix B).
# elasticsearch.ts: the same pair, same reason, one layer up — 616 differing lines out of
# 7 736, which is ~57% duplication density on each file and predates the migration entirely.
# Added by step 12's K3 (#2802), the first PR to touch enough of both twins for the
# pre-existing duplication to be re-scored as new code. This is a DELIBERATE exception to
# TD-23's "may only shrink" rule, argued in the register entry; the rule exists to stop an
# exclusion buying a conversion through the gate, which is not what these two are.
# httpRoutes.ts: the route table is ~1550 lines of near-identical 5-line literals
# (one per API route) — irreducible duplication by nature, and re-scored as new code
# by the JS->TS rename (ADR-0001, step 05, PR E1).
# memoryStorageController.ts: pre-existing intra-file duplication (the Redis-command `mapping`
# table + the near-identical arg-extraction closures for geoadd/hmset/mset and the
# extractArgumentsForZAdd/ZInterstore pair) surfaced as "new code" by the JS->TS rename.
# Deduping it is a separate refactor, deliberately deferred out of the conversion PR (ADR-0001, step 05, PR C).
sonar.cpd.exclusions=lib/api/httpRoutes.ts,lib/service/storage/7/esWrapper.ts,lib/service/storage/8/esWrapper.ts,lib/service/storage/7/elasticsearch.ts,lib/service/storage/8/elasticsearch.ts,lib/api/controllers/memoryStorageController.ts

# NB: this list may only SHRINK (ADR-0001 type-debt register, TD-23). An exclusion added
# to get a conversion PR through the new-code gate also disables CPD for that file on every
# future PR — when a file's duplication is dealt with, drop its entry in the same PR.
# Enforced, not merely stated: `npm run ratchet:cpd-exclusions` compares this list against
# .migration/cpd-exclusions.txt and fails on any addition (and on an unrecorded removal).
