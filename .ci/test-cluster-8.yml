x-kuzzle-config: &kuzzle-config
  image: kuzzleio/kuzzle-runner:${NODE_VERSION:-24}-trixie-slim
  command: >
    bash -c "
      node -r ts-node/register/transpile-only ./start-kuzzle-test.ts --enable-plugins kuzzle-plugin-cluster,functional-test-plugin
    "
  volumes:
    - "..:/var/app"
  cap_add:
    - SYS_PTRACE
  ulimits:
    nofile: 65536
  sysctls:
    - net.core.somaxconn=8192
  depends_on:
    - redis
    - elasticsearch
  environment: &kuzzle-env
    kuzzle_services__storageEngine__majorVersion: "8"
    kuzzle_services__storageEngine__client__node: "http://elasticsearch:9200"
    kuzzle_services__storageEngine__commonMapping__dynamic: "true"
    kuzzle_services__internalCache__node__host: "redis"
    kuzzle_services__memoryStorage__node__host: "redis"
    kuzzle_server__protocols__mqtt__enabled: "true"
    kuzzle_server__protocols__mqtt__developmentMode: "false"
    kuzzle_http__accessControlAllowOrigin: "localhost"
    kuzzle_limits__loginsPerSecond: "50"
    kuzzle_server__protocols__http__additionalContentTypes: '*json:["application/x-yaml"]'
    NODE_ENV: "development"
    NODE_VERSION: "${NODE_VERSION:-24}"
    DEBUG: "none"
    SECRETS_FILE_PREFIX: "/var/app/"
    # cluster
    kuzzle_plugins__cluster__privileged: "true"
    kuzzle_plugins__cluster__minimumNodes: "3"

services:
  nginx:
    image: nginx:1.19-alpine
    depends_on:
      - kuzzle_node_1
      - kuzzle_node_2
      - kuzzle_node_3
    ports:
      - "7512:7512"
    volumes:
      - ../docker/nginx-dev:/etc/nginx/conf.d

  kuzzle_node_1:
    <<: *kuzzle-config
    ports:
      - "17510:7512"
      - "1883:1883"

  kuzzle_node_2:
    <<: *kuzzle-config
    ports:
      - "17511:7512"

  kuzzle_node_3:
    <<: *kuzzle-config
    ports:
      - "17512:7512"

  # The one node that runs outside development mode. nginx (port 7512) load
  # balances over nodes 1-3 only, so the suite never lands here by accident:
  # scenarios address it by port, the way Network.feature already addresses
  # node 1 by 17510. It exists because "a stack trace never leaves the process"
  # is only true when NODE_ENV is not development — in development the stack is
  # deliberately kept and highlighted. See features/StackTrace.feature (TD-48).
  kuzzle_node_prod:
    <<: *kuzzle-config
    environment:
      <<: *kuzzle-env
      NODE_ENV: "production"
    ports:
      - "17513:7512"

  redis:
    image: redis:8
  
  elasticsearch:
    image: docker.io/bitnamilegacy/elasticsearch:8.17.1-debian-12-r6
    environment:
      - indices.id_field_data.enabled=true
    ports:
      - '9200:9200'
