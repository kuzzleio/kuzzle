# Overlay on top of `.ci/test-cluster-8.yml`: Elasticsearch 9, and every Kuzzle
# node runs the external driver kuzzle-storage-es-9 (ADR-0003 step 05),
# installed from npm as an application would. `.ci/scripts/docker-test.sh`
# adds it when STORAGE_DRIVER=es9, after staging the driver in
# .ci/storage-driver-es9/node_modules.
x-es9-driver: &es9-driver
  volumes:
    # Found by walking up from the checkout (/var/app), without touching its
    # own node_modules, which `npm ci` empties. It holds the driver, its
    # dependencies, and `kuzzle` (features/fixtures/kuzzle-self): the checkout.
    - ./storage-driver-es9/node_modules:/node_modules:ro
  environment:
    kuzzle_services__storageEngine__driver: "kuzzle-storage-es-9"

services:
  kuzzle_node_1: *es9-driver
  kuzzle_node_2: *es9-driver
  kuzzle_node_3: *es9-driver
  kuzzle_node_prod: *es9-driver

  elasticsearch:
    image: docker.io/library/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
