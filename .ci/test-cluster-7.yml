x-kuzzle-config: &kuzzle-config
  image: kuzzleio/kuzzle-runner:${NODE_VERSION:-24}-trixie-slim
  command: >
    bash -c "
      node -r ts-node/register/transpile-only ./start-kuzzle-test.ts --enable-plugins kuzzle-plugin-cluster,functional-test-plugin
    "
  volumes:
    - "..:/var/app"
  cap_add:
    - SYS_PTRACE
  ulimits:
    nofile: 65536
  sysctls:
    - net.core.somaxconn=8192
  depends_on:
    - redis
    - elasticsearch
  environment: &kuzzle-env
    kuzzle_services__storageEngine__majorVersion: "7"
    kuzzle_services__storageEngine__client__node: "http://elasticsearch:9200"
    kuzzle_services__storageEngine__commonMapping__dynamic: "true"
    kuzzle_services__internalCache__node__host: "redis"
    kuzzle_services__memoryStorage__node__host: "redis"
    kuzzle_server__protocols__mqtt__enabled: "true"
    kuzzle_server__protocols__mqtt__developmentMode: "false"
    kuzzle_http__accessControlAllowOrigin: "localhost"
    kuzzle_limits__loginsPerSecond: "50"
    kuzzle_server__protocols__http__additionalContentTypes: '*json:["application/x-yaml"]'
    NODE_ENV: "development"
    NODE_VERSION: "${NODE_VERSION:-24}"
    DEBUG: "none"
    SECRETS_FILE_PREFIX: "/var/app/"
    # cluster
    kuzzle_plugins__cluster__privileged: "true"
    kuzzle_plugins__cluster__minimumNodes: "3"

services:
  nginx:
    image: nginx:1.19-alpine
    depends_on:
      - kuzzle_node_1
      - kuzzle_node_2
      - kuzzle_node_3
    ports:
      - "7512:7512"
    volumes:
      - ../docker/nginx-dev:/etc/nginx/conf.d

  kuzzle_node_1:
    <<: *kuzzle-config
    ports:
      - "17510:7512"
      - "1883:1883"

  kuzzle_node_2:
    <<: *kuzzle-config
    ports:
      - "17511:7512"

  kuzzle_node_3:
    <<: *kuzzle-config
    ports:
      - "17512:7512"

  # The one node that runs outside development mode. It exists because "a stack
  # trace never leaves the process" is only true when NODE_ENV is not
  # development — in development the stack is deliberately kept and highlighted.
  # See features/StackTrace.feature (TD-48).
  #
  # It runs WITHOUT the cluster plugin, and nginx (port 7512) balances over
  # nodes 1-3 only: scenarios address it by port, the way Network.feature
  # already addresses node 1 by 17510. Keeping it out of the cluster is
  # deliberate — nothing in the suite reads state from it, and a fourth member
  # would add synchronisation traffic to all thirty functional jobs for no
  # benefit. The gain is a node this feature can address, not a bigger cluster.
  kuzzle_node_prod:
    <<: *kuzzle-config
    command: >
      bash -c "
        node -r ts-node/register/transpile-only ./start-kuzzle-test.ts --enable-plugins functional-test-plugin
      "
    environment:
      <<: *kuzzle-env
      NODE_ENV: "production"
    ports:
      - "17513:7512"

  redis:
    image: redis:8

  elasticsearch:
    image: kuzzleio/elasticsearch:7
    ulimits:
      nofile: 65536
