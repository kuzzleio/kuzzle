services:
  kuzzle:
    build:
      dockerfile: ./docker/images/${KUZZLE_IMAGE}/Dockerfile
      context: ..
    cap_add:
      - SYS_PTRACE
    ulimits:
      nofile: 65536
    sysctls:
      - net.core.somaxconn=8192
    environment:
      - kuzzle_services__storageEngine__majorVersion=7
      - kuzzle_services__storageEngine__client__node=http://elasticsearch:9200
      - kuzzle_services__internalCache__node__host=redis
      - kuzzle_services__memoryStorage__node__host=redis
    depends_on:
      - redis
      - elasticsearch
    ports:
      - "7512:7512"

  redis:
    image: redis:8

  elasticsearch:
    # Built from the tree, not pulled: the CI tests the kuzzleio/elasticsearch
    # image the next release publishes (release.workflow.yaml), not the last one.
    build: ../docker/images/elasticsearch
    ulimits:
      nofile: 65536
