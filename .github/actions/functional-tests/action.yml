name: Functional Tests
description: Run Cucumber tests on a Kuzzle Stack
inputs:
  docker-compose-test-file:
    description: Path to a Docker Compose file used to run tests
    required: true
  test-set:
    description: 'Name of the tests set to run (ej: test:functional:websocket)'
    required: true
  node-version:
    description: Node version to use in the Kuzzle Docker image
    required: true
  es-version:
    description: Elasticsearch version to use
    required: true
  storage-driver:
    description: 'Storage driver to run on: core-only (declares no optional capability), or an external one (es9, opensearch2, opensearch3) on top of the es-version 8 cluster; empty: the built-in driver'
    required: false
    default: ""
  storage-driver-spec:
    description: 'What npm installs as that driver (default: the version .ci/scripts/stage-storage-driver.sh pins)'
    required: false
    default: ""
  cache-engine:
    description: 'Cache server to run on instead of Redis 8: redis-6 (Redis 6.2) or valkey-9, on top of the es-version 8 cluster; empty: Redis 8'
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # NPM_CACHE_DIR: the runner's ~/.npm, which setup-node (cache: "npm")
    # restores, mounted as the npm cache of the containerised install.
    - run: NPM_CACHE_DIR="$HOME/.npm" ./.ci/scripts/run-test-cluster.sh
      env:
        KUZZLE_FUNCTIONAL_TESTS: ${{ inputs.test-set }}
        NODE_VERSION: ${{ inputs.node-version }}
        ES_VERSION: ${{ inputs.es-version }}
        STORAGE_DRIVER: ${{ inputs.storage-driver }}
        STORAGE_DRIVER_SPEC: ${{ inputs.storage-driver-spec }}
        CACHE_ENGINE: ${{ inputs.cache-engine }}
      shell: bash
