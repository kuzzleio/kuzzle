name: Build and Run Kuzzle image
description: Build and Run Kuzzle image

inputs:
  kuzzle-image:
    description: Kuzzle image target
    required: true
  es-version:
    description: Elasticsearch version to use
    required: true
  node_version:
    description: NodeJS version to use
    required: false
    default: 24

runs:
  using: "composite"
  steps:
    - run: ./.ci/scripts/with-retry.sh npm ci
      shell: bash

    - run: npm run build
      shell: bash

    - name: Docker compose up
      run: |
        export KUZZLE_IMAGE=${{ inputs.kuzzle-image }}
        export ES_VERSION=${{ inputs.es-version }}
        export NODE_VERSION=${{ inputs.node_version }}

        if [ "$ES_VERSION" == "7" ]; then
            YML_FILE='./.ci/services-7.yml'
        elif [ "$ES_VERSION" == "8" ]; then
            YML_FILE='./.ci/services-8.yml'
        else
            echo "Invalid ES_VERSION. It should be either '7' or '8'."
            exit 1 
        fi

        docker compose -f $YML_FILE up -d
      shell: bash

    - name: Checking that docker compose launch
      run: |
        export KUZZLE_IMAGE=${{ inputs.kuzzle-image }}
        export ES_VERSION=${{ inputs.es-version }}
        export NODE_VERSION=${{ inputs.node_version }}

        if [ "$ES_VERSION" == "7" ]; then
            YML_FILE='./.ci/services-7.yml'
        elif [ "$ES_VERSION" == "8" ]; then
            YML_FILE='./.ci/services-8.yml'
        else
            echo "Invalid ES_VERSION. It should be either '7' or '8'."
            exit 1 
        fi

        trap 'docker compose -f $YML_FILE logs' err

        export MAX_TRIES=60
        node -r ts-node/register/transpile-only ./bin/wait-kuzzle.ts

        trap - err
      shell: bash

    # After the readiness check, not before it: `wait-kuzzle` is TypeScript
    # since step 03 and runs through `ts-node`, which is a devDependency. The
    # image under test does not depend on this tree's `node_modules` at all —
    # `.ci/services-*.yml` builds it from `docker/images/kuzzle/Dockerfile`,
    # which copies the sources and runs its own `npm ci`.
    - run: npm prune --omit=dev
      shell: bash

    - name: Down docker compose stack
      run: |
        export KUZZLE_IMAGE=${{ inputs.kuzzle-image }}
        export ES_VERSION=${{ inputs.es-version }}
        export NODE_VERSION=${{ inputs.node_version }}

        if [ "$ES_VERSION" == "7" ]; then
            YML_FILE='./.ci/services-7.yml'
        elif [ "$ES_VERSION" == "8" ]; then
            YML_FILE='./.ci/services-8.yml'
        else
            echo "Invalid ES_VERSION. It should be either '7' or '8'."
            exit 1 
        fi

        docker compose -f $YML_FILE down -v
      shell: bash
