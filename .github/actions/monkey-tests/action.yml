name: Cluster Monkey Tests
description: Run monkey tests on a Kuzzle Cluster
inputs:
  node-version:
    description: Node version to use in the Kuzzle Docker image
    required: true
  es-version:
    description: Elasticsearch major version to run the cluster against (7 or 8)
    required: true

runs:
  using: "composite"
  steps:
    # NPM_CACHE_DIR: the runner's ~/.npm, which setup-node (cache: "npm")
    # restores, mounted as the npm cache of the containerised install.
    - run: NPM_CACHE_DIR="$HOME/.npm" ./.ci/scripts/run-monkey-tests.sh
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        ES_VERSION: ${{ inputs.es-version }}
      shell: bash
