name: Unit Tests
description: Run Node.js unit tests

runs:
  using: "composite"
  steps:
    - run: ./.ci/scripts/with-retry.sh npm ci
      shell: bash

    - run: npm run build
      shell: bash

    # There is one unit runner since ADR-0001 step 13 closed axis 2; this action
    # took a `suit` input while Mocha and vitest ran side by side.
    - run: npm run test:unit:vitest
      shell: bash
