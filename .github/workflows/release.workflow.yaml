name: Release workflow

env:
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"
  DOCKER_PLATFORMS_ELASTICSEARCH: "linux/amd64,linux/arm64"
  ELASTICSEARCH_VERSION: "7.17.29"
  NODE_VERSION: "24"

on:
  release:
    types:
      - released

# The images are pushed with the Docker Hub credentials: the workflow token
# only needs to read the repository (jobs add `id-token: write` to sign, and
# the core image `security-events: write` for its scan report). Without this
# block it got the repository default, which is read-write.
permissions:
  contents: read

jobs:
  # For retro compat we use bookworm here
  publish-runner-bookworm:
    name: Kuzzle runner Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # id-token: keyless cosign signature (see `Sign the image`).
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # Node.js 18 and 20 are end-of-life (April 2025 and April 2026): their
        # images are no longer rebuilt. The tags already pushed stay on Docker
        # Hub, frozen at their last build.
        node-version: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/kuzzle-runner/bookworm
          file: ./docker/images/kuzzle-runner/bookworm/Dockerfile
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node-version }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          # Build provenance and an SBOM, attached to the image in the registry
          # (`docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`).
          provenance: mode=max
          sbom: true
          tags: kuzzleio/kuzzle-runner:${{ matrix.node-version }},kuzzleio/kuzzle-runner:${{ matrix.node-version }}-bookworm-slim

      # Keyless: the signature binds the digest to this workflow run through
      # GitHub's OIDC token, no key to store. Check with
      # `cosign verify docker.io/kuzzleio/kuzzle-runner:<tag> --certificate-identity-regexp
      # '^https://github.com/kuzzleio/kuzzle/' --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com`.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/kuzzleio/kuzzle-runner@$DIGEST"

  publish-runner-trixie:
    name: Kuzzle runner Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # id-token: keyless cosign signature (see `Sign the image`).
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # Node.js 20 is end-of-life: see publish-runner-bookworm.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/kuzzle-runner/trixie
          file: ./docker/images/kuzzle-runner/trixie/Dockerfile
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node-version }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          # Build provenance and an SBOM, attached to the image in the registry
          # (`docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`).
          provenance: mode=max
          sbom: true
          tags: kuzzleio/kuzzle-runner:${{ matrix.node-version }}-trixie-slim

      # Keyless: the signature binds the digest to this workflow run through
      # GitHub's OIDC token, no key to store. Check with
      # `cosign verify docker.io/kuzzleio/kuzzle-runner:<tag> --certificate-identity-regexp
      # '^https://github.com/kuzzleio/kuzzle/' --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com`.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/kuzzleio/kuzzle-runner@$DIGEST"

  publish-kuzzle-core:
    name: Kuzzle core Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # id-token: keyless cosign signature; security-events: the scan report.
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get current version from package.json
        shell: bash
        id: get-version
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "major-version=$(jq -r .version package.json | cut -d. -f 1)" >> "$GITHUB_OUTPUT"

      # Scanned before anything is pushed: the amd64 image, built and loaded
      # locally (the multi-platform build below reuses its layers).
      - name: Build the image to scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/images/kuzzle/Dockerfile
          load: true
          build-args: NODE_VERSION=${{ env.NODE_VERSION }}
          platforms: linux/amd64
          tags: kuzzle-release-scan:${{ steps.get-version.outputs.version }}

      # Every finding, OS packages and npm dependencies, to the repository's
      # code scanning alerts. Informational: npm advisories are handled in the
      # dependency bumps, and the Dependency review job gates new ones.
      - name: Scan the image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuzzle-release-scan:${{ steps.get-version.outputs.version }}
          version: v0.70.0
          format: sarif
          output: trivy-kuzzle.sarif
          exit-code: "0"

      - name: Upload the scan report
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-kuzzle.sarif
          category: trivy-kuzzle-image

      # The gate: a critical vulnerability in an OS package that has a fix
      # means the base image must be rebuilt or bumped before publishing.
      - name: Scan the image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuzzle-release-scan:${{ steps.get-version.outputs.version }}
          version: v0.70.0
          vuln-type: os
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/images/kuzzle/Dockerfile
          push: true
          build-args: NODE_VERSION=${{ env.NODE_VERSION }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          # Build provenance and an SBOM, attached to the image in the registry
          # (`docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`).
          provenance: mode=max
          sbom: true
          tags: kuzzleio/kuzzle:${{ steps.get-version.outputs.major-version }},kuzzleio/kuzzle:latest,kuzzleio/kuzzle:${{ steps.get-version.outputs.version }}

      # Keyless: the signature binds the digest to this workflow run through
      # GitHub's OIDC token, no key to store. Check with
      # `cosign verify docker.io/kuzzleio/kuzzle:<tag> --certificate-identity-regexp
      # '^https://github.com/kuzzleio/kuzzle/' --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com`.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/kuzzleio/kuzzle@$DIGEST"

  publish-elasticsearch:
    name: Elasticsearch Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: keyless cosign signature (see `Sign the image`).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/images/elasticsearch
          file: ./docker/images/elasticsearch/Dockerfile
          push: true
          build-args: ELASTICSEARCH_VERSION=${{ env.ELASTICSEARCH_VERSION }}
          platforms: ${{ env.DOCKER_PLATFORMS_ELASTICSEARCH }}
          # Build provenance and an SBOM, attached to the image in the registry
          # (`docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`).
          provenance: mode=max
          sbom: true
          tags: kuzzleio/elasticsearch:${{ env.ELASTICSEARCH_VERSION }},kuzzleio/elasticsearch:7, kuzzleio/elasticsearch:latest

      # Keyless: the signature binds the digest to this workflow run through
      # GitHub's OIDC token, no key to store. Check with
      # `cosign verify docker.io/kuzzleio/elasticsearch:<tag> --certificate-identity-regexp
      # '^https://github.com/kuzzleio/kuzzle/' --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com`.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/kuzzleio/elasticsearch@$DIGEST"
