name: Tests

on:
  pull_request:
  # The full test matrix after every merge, and on demand ("Run workflow" on
  # any branch); pull requests to 2-dev run a reduced one. See
  # .ci/scripts/ci-plan.sh.
  push:
    branches: [2-dev]
  workflow_dispatch:

env:
  # Referenced by every job that does not deliberately run a Node matrix.
  # It used to be spelled NODE_LTS_ACTIVE_VERSION and was never defined
  # anywhere, so those jobs ran on whatever Node the runner image shipped
  # (ADR-0001 type-debt register, TD-47 — #2734).
  NODE_VERSION: "22"

# Least privilege: only the Sonar job needs more, and it mints its own app
# token for PR decoration (TD-47).
permissions:
  contents: read

# A push supersedes the run it interrupts. Without this, three pushes in a row
# mean three full ~50-job runs to completion, two of them answering a question
# nobody is asking any more. Pairs with the `fail-fast: false` TD-33 (#2715)
# put on the functional matrix: that keeps sibling variants running, which is
# worth paying for on the *current* commit only (TD-47).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs/adr-state.json is the structured extract of the ADR hubs that feeds
  # the Claude Code session-start digest. It holds the current state only,
  # under a schema, and must not contradict the hubs it points to. Node only,
  # through Node's type stripping: no `npm ci`.
  adr-state:
    name: ADR state schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Schema and consistency of docs/adr-state.json
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .ci/scripts/adr-state.ts --check

  # Fails on a dependency this PR adds or bumps to a version with a known
  # high or critical advisory. Only the PR's own changes: the advisories the
  # base branch already carries do not block it (npm audit is for those).
  # What the test jobs run: nothing for a documentation-only change,
  # and the full or the reduced test matrix. See .ci/scripts/ci-plan.sh.
  # None of the jobs it skips or trims is a required check (SonarCloud is).
  changes:
    name: Test plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      full: ${{ steps.plan.outputs.full }}
      functional: ${{ steps.plan.outputs.functional }}
      drivers: ${{ steps.plan.outputs.drivers }}
      core-only: ${{ steps.plan.outputs.core-only }}
      monkey: ${{ steps.plan.outputs.monkey }}
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Changed files and test matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # A pull request against its base, a push against what it replaced.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.ci/scripts/ci-plan.sh
        shell: bash

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Review the dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  error-codes-check:
    name: Documentation - Error codes check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: ./.ci/scripts/with-retry.sh npm ci

      - name: Test error codes
        run: ./.ci/scripts/check-error-codes-documentation.sh

  # Bounds the repository's own living documentation (ADR hubs, open steps,
  # AGENTS.md, skills...). ADR-0001's hub was compacted on 2026-09-18 and was
  # back at 116 KB nine days later, because nothing bounded it. Node only: the
  # script runs through Node's type stripping, so no `npm ci`. Rules:
  # docs/doc-budgets.json.
  doc-budgets:
    name: Documentation budgets
    # Measured against the PR's base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The base branch's history is what tells a write-once archive that
          # grew in this PR apart from one that was already that size.
          fetch-depth: 0

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Size budgets of the documentation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .ci/scripts/check-doc-budgets.ts --base "origin/$BASE_REF"

  lint:
    name: Lint - Node.js
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No Node matrix: ESLint's and Prettier's verdict on a fixed source tree
    # with a fixed config does not depend on the Node major running them, and
    # this job gates three others — the slowest of three identical runs used to
    # sit on the critical path for nothing (TD-47).
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: ./.ci/scripts/with-retry.sh npm ci
        shell: bash

      - name: ESLint
        run: npm run test:lint
        shell: bash

      # `npm run prettier` only ever *wrote*; nothing checked. Both globs now
      # cover ./tests, the vitest tree every new spec goes to, which neither
      # tool used to see (TD-39 — #2726).
      - name: Prettier
        run: npm run prettier:check
        shell: bash

  migration-ratchets:
    name: TS migration - ratchets & test type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: ./.ci/scripts/with-retry.sh npm ci
        shell: bash

      # Ratchets: the .js / explicit-any / cast counts may only decrease.
      # See docs/adr-001/steps/01-sprint-0-tooling.md, step 06 and scripts/ratchet.sh.
      # Two have retired, both by reaching their floor and staying there: the
      # `implicit-any` ratchet with the strict flip (step 12, K6) — `strict` in
      # tsconfig.json subsumes `noImplicitAny` for lib/, and the build now fails on
      # what that ratchet used to count — and the `mocha` ratchet with step 13's L7,
      # which deleted the suite it counted.
      - name: Migration ratchets (js / any / casts / cpd-exclusions)
        run: npm run ratchet
        shell: bash

      # `strict` lives in tsconfig.json since step 12 (K6), so the production
      # type-check IS the build, gated by the `build` job below. What that program
      # does not cover is the test code: `strict` applies to a whole program, so the
      # test code has its own, `tsconfig.tests.json` — `strict: true` since step 14's
      # M6 moved the last directory into it, and `noEmit`, because the build emits
      # from the other one. See docs/adr-001/steps/14-test-program-strict.md.
      - name: Type-check the test program
        run: npm run typecheck:tests
        shell: bash

  # The build and its payload gate used to live inside `sonarqube`, which is
  # fork-gated — so on a pull request from a fork, `check-build-payload.sh`
  # never ran at all, and neither did the 30 functional jobs nor the 6 monkey
  # jobs that hung off `needs: [sonarqube]` (a skipped `needs` skips its
  # dependents). See ADR-0001 type-debt register, TD-38 (#2725).
  #
  # `sonarqube` keeps a build step of its own: artifacts are not shared between
  # jobs here, and its coverage run needs the package built.
  build:
    name: Build and payload gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: ./.ci/scripts/with-retry.sh npm ci
        shell: bash

      # dumpme, boost-geospatial-index and kuzzle-espresso-logic-minimizer ship
      # prebuilt binaries: a compile at install time is a regression (#2839).
      - name: Check that no native addon was compiled
        run: ./.ci/scripts/check-prebuilt-addons.sh
        shell: bash

      - name: Build
        run: npm run build
        shell: bash

      # `tsc` succeeding does not mean the build is complete: the .proto files
      # and the server entrypoint are copied in by bin/copy-binaries.ts, and
      # the error-code catalogue by tsc's own `resolveJsonModule`. The gate is
      # derived from package.json's `files` (TD-35/36/37).
      - name: Check the build payload
        run: ./.ci/scripts/check-build-payload.sh
        shell: bash

      # The published typings, compiled by a consumer — an application and a
      # plugin — with `strict` on and off. A declaration change that makes code
      # compiled against the previous release fail is a breaking change even
      # when `lib/` is right, and nothing else here compiles against `dist/`
      # (ADR-0001 step 15, TY-01…TY-07). See tests/typings/tsconfig.json.
      - name: Type-check a consumer of the published typings
        run: npm run typecheck:typings
        shell: bash

      # The same typings, installed from the packed tarball as a consumer gets
      # them — production dependencies only — and compiled without
      # `skipLibCheck`: a type package they need must not be a dev dependency.
      - name: Check the published typings need no dev dependency
        run: ./.ci/scripts/check-typings-dependencies.sh
        shell: bash

  sonarqube:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pull requests only: sonar-branches.workflow.yaml analyses the pushes.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: [lint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: ./.ci/scripts/with-retry.sh npm ci
        shell: bash

      - name: Build
        run: npm run build
        shell: bash

      # `tsc` succeeding does not mean the build is complete: the .proto files and
      # the server entrypoint are copied in by bin/copy-binaries.ts, which nothing
      # used to assert ran. A published package missing its .proto files only fails
      # when a cluster node boots.
      - name: Check the build payload
        run: ./.ci/scripts/check-build-payload.sh
        shell: bash

      # One runner feeds the scanner since step 13 closed axis 2. Before ADR-0001
      # step 06 only mocha ran here, and `.ts` was coverage-excluded outright, so
      # every JS->TS conversion silently left the coverage gate (TD-24) — that is
      # the debt the two-runner pairing paid off, and it is paid.
      - name: Vitest coverage
        run: npm run test:unit:vitest
        shell: bash

      # The storage driver conformance kit's cases only run against a real
      # engine (ADR-0003 step 04): their coverage comes from this run, against
      # the built-in Elasticsearch 8 driver. The `storage-conformance` job runs
      # them against both majors.
      - name: Conformance kit coverage
        run: |
          docker run -d -p 9200:9200 -e indices.id_field_data.enabled=true docker.io/bitnamilegacy/elasticsearch:8.17.1-debian-12-r6
          npm run test:conformance -- --coverage
        shell: bash
        env:
          ES_VERSION: "8"

      # Holds the rule the aggregate gate cannot: every lib/**.ts this PR adds
      # must be executed by at least one spec. SonarCloud's 80% new_coverage is
      # an aggregate over the block, and an aggregate says nothing about its
      # worst member — #2723 passed at 88.3% with three files carrying no spec
      # at all (TD-42, #2729). The base commit is what "new in this PR" is
      # measured against; the checkout above is unshallow, so it is in history.
      #
      # This was `prepare-coverage.ts`, and it also normalised the two reports
      # the two runners produced — a c8 artefact correction and an ownership
      # arbiter. Step 13's L7b removed both with the second runner; see that
      # step's `What L7b found` for the measurement that justified it.
      - name: Coverage gate — every new lib/ file is executed by a spec
        run: npx tsx .ci/scripts/coverage-gate.ts coverage/vitest/lcov.info
        shell: bash
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # client-id replaces the deprecated app-id: the action passes the value as-is
      # as the JWT iss, which GitHub accepts as a Client ID or a numeric App ID,
      # hence the unchanged KUZZLE_BOT_APP_ID variable.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }} # Required for PR decoration

  unit-tests:
    name: Unit Tests
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        # One runner, so no suite dimension: `mocha` left this matrix with the last
        # Mocha spec (step 13, L6h) and its apparatus with L7. ADR-0001's axis 2 is
        # closed — vitest is the unit runner.
        node-version: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Unit test using Node ${{ matrix.node-version }}
        uses: ./.github/actions/unit-tests
        env:
          NODE_VERSION: ${{ matrix.node-version }}

  # The storage driver conformance kit (ADR-0003 step 04) against the built-in
  # driver of each Elasticsearch major: what proves the kit that driver
  # repositories run against their own engine. Docker only, like the local path.
  storage-conformance:
    name: Storage driver conformance
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        es-version: [7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Conformance kit against the built-in Elasticsearch ${{ matrix.es-version }} driver
        run: ./.ci/scripts/docker-test.sh conformance
        shell: bash
        env:
          ES_VERSION: ${{ matrix.es-version }}

  build-and-run-kuzzle:
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    name: Build and Run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        kuzzle-image: ["kuzzle"]
        es-version: [7, 8]
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test to run Kuzzle image
        uses: ./.github/actions/build-and-run-kuzzle
        with:
          kuzzle-image: ${{ matrix.kuzzle-image }}
          es-version: ${{ matrix.es-version }}

  functional-tests:
    name: Functional tests
    # Not `needs: [sonarqube]`: nothing in the functional suite consumes the
    # Sonar scan, and depending on a fork-gated job skipped this whole matrix
    # on every pull request from a fork (TD-38).
    # Not `needs: [unit-tests]` either: the unit tests sat on the critical path
    # (~2.5 min) for a gate the functional jobs do not use. A unit failure now
    # no longer spares the 30 functional jobs, which is the price of the time.
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # One flaky variant must not cancel the others: a re-run is otherwise
      # the only way to learn whether anything else was broken.
      fail-fast: false
      # Every test set × Node.js 22/24 × Elasticsearch 7/8, or the reduced
      # matrix on a pull request to 2-dev (.ci/scripts/ci-plan.sh).
      matrix: ${{ fromJSON(needs.changes.outputs.functional) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Test suit ${{ matrix.test-set }}
        uses: ./.github/actions/functional-tests
        with:
          test-set: test:functional:${{ matrix.test-set }}
          node-version: ${{ matrix.node-version }}
          es-version: ${{ matrix.es-version }}

  # Elasticsearch 9 and OpenSearch 2 / 3 through the external drivers
  # kuzzle-storage-es-9 (ADR-0003 step 05) and kuzzle-storage-opensearch-2 /
  # -3 (step 07), installed from npm as an application would, at the versions
  # .ci/scripts/stage-storage-driver.sh pins. One Node.js version: the drivers
  # do not depend on it, the matrix above covers both. Every driver × test
  # set, or each driver once on a pull request to 2-dev.
  functional-tests-external-drivers:
    name: Functional tests on the ${{ matrix.driver }} driver (${{ matrix.test-set }})
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.drivers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: "npm"

      - name: Test suit ${{ matrix.test-set }}
        uses: ./.github/actions/functional-tests
        with:
          test-set: test:functional:${{ matrix.test-set }}
          node-version: 24
          es-version: 8
          storage-driver: ${{ matrix.driver }}

  # The built-in driver under a manifest declaring no optional capability
  # (ADR-0003 step 04, #3136): Kuzzle must start and serve everything else,
  # and the suite skips the `@capability-*` scenarios. The two current
  # protocols on ES 8 and one Node.js version: the legacy suites and the other
  # combinations exercise nothing this profile changes.
  functional-tests-core-only-driver:
    name: Functional tests on the core-only driver (${{ matrix.test-set }})
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # Both current protocols, or websocket only on a pull request to 2-dev.
      matrix: ${{ fromJSON(needs.changes.outputs.core-only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: "npm"

      - name: Test suit ${{ matrix.test-set }}
        uses: ./.github/actions/functional-tests
        with:
          test-set: test:functional:${{ matrix.test-set }}
          node-version: 24
          es-version: 8
          storage-driver: core-only

  # The cache on the two ends of the Redis / Valkey compatibility matrix
  # (doc/2/guides/compatibility) that the main matrix's Redis 8 does not
  # cover: Redis 6.2, the oldest supported, and Valkey 9. The websocket suite
  # on ES 8 and one Node.js version: the cache does not depend on the
  # protocol, the storage engine or Node.js.
  functional-tests-cache-engines:
    name: Functional tests on ${{ matrix.cache-engine }}
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        cache-engine: ["redis-6", "valkey-9"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node version 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: "npm"

      - name: Test suit websocket
        uses: ./.github/actions/functional-tests
        with:
          test-set: test:functional:websocket
          node-version: 24
          es-version: 8
          cache-engine: ${{ matrix.cache-engine }}

  cluster-monkey-tests:
    name: Cluster Monkey Tests
    # Only the build: the monkey suite consumes nothing the functional jobs
    # produce, and waiting for the slowest of them put ~2.5 min on the
    # critical path of every PR.
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Same reason as the functional matrix above, and it was left off this one
      # when TD-33 added it there: the monkey suite is randomised, so one
      # variant failing is exactly when the other results matter most.
      fail-fast: false
      # Node.js 22/24 × Elasticsearch 7/8, or (22, 7) and (24, 8) on a pull
      # request to 2-dev.
      matrix: ${{ fromJSON(needs.changes.outputs.monkey) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Cloning Monkey Tester
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: kuzzleio/kuzzle-monkey-tests
          # A commit, not the default branch: what runs here (and its
          # `npm ci`) changes only through a PR on this repository. This one
          # exits non-zero on a missed notification or response or an init
          # failure, and checks the last expectations before exiting
          # (kuzzleio/kuzzle-monkey-tests#1): until then those passed green.
          ref: 32b9c503015995b38eca64e2b6f74a94a244a271
