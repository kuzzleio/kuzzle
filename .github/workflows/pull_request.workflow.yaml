name: Tests

on: [pull_request]

env:
  # Referenced by every job that does not deliberately run a Node matrix.
  # It used to be spelled NODE_LTS_ACTIVE_VERSION and was never defined
  # anywhere, so those jobs ran on whatever Node the runner image shipped
  # (ADR-0001 type-debt register, TD-47 — #2734).
  NODE_VERSION: "22"

# Least privilege: only the Sonar job needs more, and it mints its own app
# token for PR decoration (TD-47).
permissions:
  contents: read

# A push supersedes the run it interrupts. Without this, three pushes in a row
# mean three full ~50-job runs to completion, two of them answering a question
# nobody is asking any more. Pairs with the `fail-fast: false` TD-33 (#2715)
# put on the functional matrix: that keeps sibling variants running, which is
# worth paying for on the *current* commit only (TD-47).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  error-codes-check:
    name: Documentation - Error codes check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test error codes
        run: ./.ci/scripts/check-error-codes-documentation.sh

  lint:
    name: Lint - Node.js
    runs-on: ubuntu-24.04
    # No Node matrix: ESLint's and Prettier's verdict on a fixed source tree
    # with a fixed config does not depend on the Node major running them, and
    # this job gates three others — the slowest of three identical runs used to
    # sit on the critical path for nothing (TD-47).
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: ESLint
        run: npm run test:lint
        shell: bash

      # `npm run prettier` only ever *wrote*; nothing checked. Both globs now
      # cover ./tests, the vitest tree every new spec goes to, which neither
      # tool used to see (TD-39 — #2726).
      - name: Prettier
        run: npm run prettier:check
        shell: bash

  migration-ratchets:
    name: TS migration - ratchets & test type-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        shell: bash

      # Ratchets: the .js / mocha / explicit-any / cast counts may only decrease.
      # See docs/adr-001/steps/01-sprint-0-tooling.md, step 06 and scripts/ratchet.sh.
      # The `implicit-any` ratchet retired with the strict flip (step 12, K6):
      # `strict` in tsconfig.json subsumes `noImplicitAny` for lib/, and the build
      # now fails on what that ratchet used to count.
      - name: Migration ratchets (js / mocha / any / casts / cpd-exclusions)
        run: npm run ratchet
        shell: bash

      # `strict` lives in tsconfig.json since step 12 (K6), so the production
      # type-check IS the build, gated by the `build` job below. What that program
      # no longer covers is the test code: `strict` applies to a whole program, so
      # the specs have their own (tsconfig.tests.json, strict off, allowJs on) and
      # it is checked here — exactly the checking they had before the flip.
      - name: Type-check the test programs
        run: npm run typecheck:tests
        shell: bash

  # The build and its payload gate used to live inside `sonarqube`, which is
  # fork-gated — so on a pull request from a fork, `check-build-payload.sh`
  # never ran at all, and neither did the 30 functional jobs nor the 6 monkey
  # jobs that hung off `needs: [sonarqube]` (a skipped `needs` skips its
  # dependents). See ADR-0001 type-debt register, TD-38 (#2725).
  #
  # `sonarqube` keeps a build step of its own: artifacts are not shared between
  # jobs here, and its coverage run needs the package built.
  build:
    name: Build and payload gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build
        run: npm run build
        shell: bash

      # `tsc` succeeding does not mean the build is complete: the .proto files
      # and the server entrypoint are copied in by bin/copy-binaries.ts, and
      # the error-code catalogue by tsc's own `resolveJsonModule`. The gate is
      # derived from package.json's `files` (TD-35/36/37).
      - name: Check the build payload
        run: ./.ci/scripts/check-build-payload.sh
        shell: bash

  sonarqube:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.fork == false
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build
        run: npm run build
        shell: bash

      # `tsc` succeeding does not mean the build is complete: the .proto files and
      # the server entrypoint are copied in by bin/copy-binaries.ts, which nothing
      # used to assert ran. A published package missing its .proto files only fails
      # when a cluster node boots.
      - name: Check the build payload
        run: ./.ci/scripts/check-build-payload.sh
        shell: bash

      # One runner feeds the scanner since step 13 L6h emptied the Mocha suite:
      # vitest writes coverage/vitest/lcov.info, and the mocha half of the
      # normalisation below simply finds no report. Before ADR-0001 step 06 only
      # mocha ran here, and `.ts` was coverage-excluded outright, so every
      # JS->TS conversion silently left the coverage gate (TD-24) — that is the
      # debt this pairing paid off, and it is now paid.
      - name: Vitest coverage
        run: npm run test:unit:vitest
        shell: bash

      # The two runners disagree on which lines of a .ts file are executable:
      # c8 derives its set from the COMPILED output and reports every line of a
      # loaded file (blank lines and comments included), while vitest's v8
      # provider reports only real statements. Merging the two line sets
      # understates coverage badly — it put clientAdapter.ts at 40% with every
      # one of its handlers under test. This normalises both reports and gives
      # each file a single owner. See docs/adr-001/steps/07-sprint-5-core-i.md.
      #
      # It also holds the rule the aggregate gate cannot: every lib/**.js
      # renamed to .ts in this PR must be executed by at least one spec.
      # SonarCloud's 80% new_coverage is an aggregate over the block, and an
      # aggregate says nothing about its worst member — #2723 passed at 88.3%
      # with three files carrying no spec at all (TD-42, #2729). The base
      # commit is what "converted in this PR" is measured against; the checkout
      # above is unshallow, so it is in history.
      - name: Normalise the coverage reports
        run: npx tsx .ci/scripts/prepare-coverage.ts coverage/mocha/lcov.info coverage/vitest/lcov.info
        shell: bash
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }} # Required for PR decoration

  unit-tests:
    name: Unit Tests
    needs: [lint]
    strategy:
      matrix:
        node-version: [20, 22, 24]
        # `mocha` left the matrix with the last Mocha spec (step 13, L6h): the
        # runner errors out when its glob matches nothing. The apparatus it
        # belongs to — the dependency, `.mocharc.json`, `test/` and the
        # `test:unit:mocha*` scripts — goes with L7.
        test-suits: ["vitest"]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Unit test using Node ${{ matrix.node-version }}
        uses: ./.github/actions/unit-tests
        with:
          suit: ${{ matrix.test-suits }}
        env:
          NODE_VERSION: ${{ matrix.node-version }}

  build-and-run-kuzzle:
    needs: [lint]
    name: Build and Run
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        kuzzle-image: ["kuzzle"]
        es-version: [7, 8]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Test to run Kuzzle image
        uses: ./.github/actions/build-and-run-kuzzle
        with:
          kuzzle-image: ${{ matrix.kuzzle-image }}
          es-version: ${{ matrix.es-version }}

  functional-tests:
    name: Functional tests
    # Not `needs: [sonarqube]`: nothing in the functional suite consumes the
    # Sonar scan, and depending on a fork-gated job skipped this whole matrix
    # on every pull request from a fork (TD-38).
    needs: [build, unit-tests]
    strategy:
      # One flaky variant must not cancel the 29 others: a re-run is otherwise
      # the only way to learn whether anything else was broken.
      fail-fast: false
      matrix:
        test-set:
          [
            "http",
            "websocket",
            "legacy:mqtt",
            "legacy:http",
            "legacy:websocket",
          ]
        node-version: [20, 22, 24]
        es-version: [7, 8]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Node version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Test suit ${{ matrix.test-set }}
        uses: ./.github/actions/functional-tests
        with:
          test-set: test:functional:${{ matrix.test-set }}
          node-version: ${{ matrix.node-version }}
          es-version: ${{ matrix.es-version }}

  cluster-monkey-tests:
    name: Cluster Monkey Tests
    needs: [functional-tests, build-and-run-kuzzle]
    runs-on: ubuntu-24.04
    strategy:
      # Same reason as the functional matrix above, and it was left off this one
      # when TD-33 added it there: the monkey suite is randomised, so one
      # variant failing is exactly when the other five results matter most.
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        es-version: [7, 8]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install additional libraries
        uses: ./.github/actions/install-packages

      - name: Cloning Monkey Tester
        uses: actions/checkout@v4
        with:
          repository: kuzzleio/kuzzle-monkey-tests
          path: "kuzzle-monkey-tests"

      - name: Node version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Monkey testing
        uses: ./.github/actions/monkey-tests
        with:
          node-version: ${{ matrix.node-version }}
          es-version: ${{matrix.es-version}}
