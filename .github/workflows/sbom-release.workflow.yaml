name: SBOM publish

env:
  NODE_VERSION: "22"

on:
  release:
    types:
      - prereleased
      - released

  workflow_call:
    inputs:
      node_lts_current_version:
        description: "Current Node LTS Version"
        required: true
        default: "22"
        type: string

  workflow_dispatch:
    inputs:
      node_lts_current_version:
        description: "Current Node LTS Version"
        required: false
        default: "22"
        type: string

jobs:
  publish-sbom-to-dtrack:
    name: Publish SBOM to Dependency-Track
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install
      # Pinned: an unpinned npx picked up 7.x, whose XML output needs the
      # optional xmlbuilder2 package and failed every release since 2.61.1.
      # JSON needs no optional dependency; spec 1.6 is what 6.x produced.
      - name: Create SBOM with CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --spec-version 1.6 --output-format JSON --output-file bom.json

      - name: Get the current project version from package.json
        id: get-version
        run: |
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Publish SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverhostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          projectname: "Kuzzle Backend"
          projectversion: "${{ steps.get-version.outputs.version }}"
          bomfilename: "./bom.json"
          autocreate: true
