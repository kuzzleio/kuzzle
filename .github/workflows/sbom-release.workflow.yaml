name: SBOM publish

env:
  NODE_VERSION: "22"

on:
  release:
    types:
      - prereleased
      - released

  workflow_call:
    inputs:
      node_lts_current_version:
        description: "Current Node LTS Version"
        required: false
        default: "22"
        type: string

  workflow_dispatch:
    inputs:
      node_lts_current_version:
        description: "Current Node LTS Version"
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  publish-sbom-to-dtrack:
    name: Publish SBOM to Dependency-Track
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node version ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No dependency cache in a publishing job: a poisoned cache entry
          # would end up in what is published. setup-node v5+ turns it on by
          # itself because package.json declares `packageManager`.
          package-manager-cache: false

      # `npm ci`, not `npm install`: the SBOM must describe the dependency tree
      # the lockfile pins — the one that was released — not whatever the
      # registry resolves on the day the workflow runs.
      - name: Install dependencies
        run: ./.ci/scripts/with-retry.sh npm ci

      # Pinned: an unpinned npx picked up 7.x, whose XML output needs the
      # optional xmlbuilder2 package and failed every release since 2.61.1.
      # JSON needs no optional dependency; spec 1.6 is what 6.x produced.
      - name: Create SBOM with CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --spec-version 1.6 --output-format JSON --output-file bom.json

      - name: Get the current project version from package.json
        id: get-version
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Publish SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@331f980a6eba119842052f447c54b09e4888b4c6 # v4.3.0
        with:
          serverhostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          projectname: "Kuzzle Backend"
          projectversion: "${{ steps.get-version.outputs.version }}"
          bomfilename: "./bom.json"
          autocreate: true
